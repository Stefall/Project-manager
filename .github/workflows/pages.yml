# Démo VLT Project Manager sur GitHub Pages, connectée directement au Google Sheet.
# Prérequis (une fois) : Settings → Pages → Source « GitHub Actions ».
# L'ID client OAuth et l'identifiant du Sheet ne sont pas secrets (l'accès dépend du partage du Sheet) :
# valeurs de la démo ci-dessous, remplaçables par les variables GOOGLE_CLIENT_ID et SPREADSHEET_ID du dépôt.
name: Démo GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || '709702933771-rm8js5m5mtdi1sd91mksiq0jol5ubftu.apps.googleusercontent.com' }}
  SPREADSHEET_ID: ${{ vars.SPREADSHEET_ID || '1okHS34IpNTE-mOEuQo82X1zZPiExos2xG4TpZ0D8etY' }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        working-directory: frontend
        env:
          VITE_BACKEND: sheets
          VITE_GOOGLE_CLIENT_ID: ${{ env.GOOGLE_CLIENT_ID }}
          VITE_SPREADSHEET_ID: ${{ env.SPREADSHEET_ID }}
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_OUT_DIR: dist
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
