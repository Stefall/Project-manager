# Démo VLT Project Manager sur GitHub Pages, connectée directement au Google Sheet.
# Prérequis (une fois) : Settings → Pages → Source « GitHub Actions »,
# et Settings → Secrets and variables → Actions → Variables : GOOGLE_CLIENT_ID, SPREADSHEET_ID.
name: Démo GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Vérifier la configuration
        run: |
          test -n "${{ vars.GOOGLE_CLIENT_ID }}" || { echo "::error::Variable GOOGLE_CLIENT_ID manquante"; exit 1; }
          test -n "${{ vars.SPREADSHEET_ID }}" || { echo "::error::Variable SPREADSHEET_ID manquante"; exit 1; }
      - name: Build
        working-directory: frontend
        env:
          VITE_BACKEND: sheets
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_SPREADSHEET_ID: ${{ vars.SPREADSHEET_ID }}
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_OUT_DIR: dist
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
